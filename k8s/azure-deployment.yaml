---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loanpred-api
  labels:
    app: loanpred-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loanpred-api
  template:
    metadata:
      labels:
        app: loanpred-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8005"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: loanpred
          image: loanpredictionacr.azurecr.io/loanpred:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: azure-secrets
                  key: connection-string
            - name: ENABLE_METRICS
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: loanpred-api
  labels:
    app: loanpred-api
spec:
  type: LoadBalancer
  selector:
    app: loanpred-api
  ports:
    - name: http
      port: 80
      targetPort: 8005

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loanpred-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loanpred-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
