  # Job 4: Deploy to AKS (Alternative - uncomment if using AKS)
  deploy-aks:
    name: Deploy to Azure Kubernetes Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: loanpred-aks

      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic azure-secrets \
            --from-literal=connection-string="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          # Update image in deployment
          kubectl set image deployment/loanpred-api \
            loanpred=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Wait for rollout
          kubectl rollout status deployment/loanpred-api

          # Get service URL
          kubectl get service loanpred-api
